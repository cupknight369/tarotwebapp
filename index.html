<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tarot</title>
    <link href="./dist/output.css" rel="stylesheet" />
    <script defer type="text/javascript" src="./dist/index.js"></script>
    <script defer type="text/javascript" src="alpine.min.js"></script>
  </head>

  <body class="bg-gray-800 p-6 text-white ">
    <main x-data="{
        num: 0,
        singleDrawNum: null,
        multiDrawNums: new Set(),
      }" x-ref="main">
      <h1 class="mt-5 text-xl font-medium tracking-tight">Hello Tarot!</h1>
      <hr class="py-3"/>

      <div>
        <div x-data="{ showShuffledConfirmation: false }">
          <button type="button" 
            class="px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2" 
            @click="compSingleDraw($store, $data, $refs);">Single Draw</button>
          <button type="button" 
            class="px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2" 
            @click="$store.shuffledCards = shuffle($store.cards); showShuffledConfirmation = true; setTimeout(()=> showShuffledConfirmation = false, 3000);">Shuffle Deck</button>
          <p 
            x-show="showShuffledConfirmation"
            class="inline-block text-md">Shuffled!</p>
        </div>
        <div>
          <img x-ref="cardImage" class="w-[150px]" />
          <p 
            x-text="singleDrawNum !== null ? $store.shuffledCards[singleDrawNum]?.title : 'Nothing drawn yet...'"
            class="text-xl font-bold mt-3"></p>
          <button 
            x-show="singleDrawNum !== null"
            type="button"
            class="mt-2 px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
            @click="if (singleDrawNum !== null) { addCardToCanvas($store.shuffledCards[singleDrawNum]); }">
            Add to Canvas
          </button>
        </div>
      </div>
      
      <div>
        <form class="flex flex-col mt-5" @submit.prevent="multiDrawNums = drawMultipleCards(parseInt(event.target.multiDraw.value));">
          <label for="multiDraw" class="block text-xl font-bold text-gray-200 mb-1">Enter a number 1-10:</label>
          <input name="multiDraw" 
            class="w-full rounded-md border border-gray-600 bg-gray-900 text-gray-100
              placeholder-gray-500
              focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
              px-3 py-2 shadow-sm" 
            type="number" 
            min="1" 
            max="10" />
        </form>

        <ul>
          <template x-for="num in [...multiDrawNums]">
            <li class="text-xl font-bold text-gray-200" x-text="$store.shuffledCards[num]?.title"></li>
          </template>
        </ul>
        <button 
          x-show="multiDrawNums.size > 0"
          type="button"
          class="mt-2 px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          @click="[...multiDrawNums].forEach(num => { if ($store.shuffledCards[num]) addCardToCanvas($store.shuffledCards[num]); });">
          Add All to Canvas
        </button>
      </div>
      
      <div x-data="{ specificIndexCard: null }">
        <form class="flex flex-col mt-5" @submit.prevent="specificIndexCard = $store.shuffledCards[event.target.specificCardIndex.value];">
          <label for="multiDraw" class="block text-xl font-bold text-gray-200 mb-1">Enter a number 0-77:</label>
          <input name="specificCardIndex" 
            class="w-full rounded-md border border-gray-600 bg-gray-900 text-gray-100
              placeholder-gray-500
              focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
              px-3 py-2 shadow-sm" 
            type="number" 
            min="0" 
            max="77" />
        </form>

        <p class="text-xl font-bold text-gray-200" x-text="specificIndexCard?.title"></p>
        <button 
          x-show="specificIndexCard !== null"
          type="button"
          class="mt-2 px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          @click="if (specificIndexCard !== null) { addCardToCanvas(specificIndexCard); }">
          Add to Canvas
        </button>
      </div>

      <!-- Draggable Zone -->
      <div class="mt-8">
        <h2 class="text-xl font-bold mb-4">Draggable Canvas</h2>
        <div 
          x-data="draggableZone()"
          id="draggable-container"
          class="draggable-container relative w-full bg-gray-900 border-2 border-gray-700 rounded-lg overflow-hidden"
          style="height: 600px; min-height: 600px;">
          
          <template x-for="draggableCard in draggableCards" :key="draggableCard.id">
            <div 
              class="absolute cursor-grab select-none will-change-transform"
              :id="draggableCard.id"
              :style="`left: ${draggableCard.x}px; top: ${draggableCard.y}px; z-index: ${draggableCard.zIndex};`"
              draggable="true">
              <img 
                :src="draggableCard.card.img" 
                :alt="draggableCard.card.title"
                class="w-[150px] h-auto pointer-events-none shadow-lg rounded block"
                style="max-width: 150px; width: 150px;"
                draggable="false" />
            </div>
          </template>
          
          <div 
            x-show="draggableCards.length === 0"
            class="absolute inset-0 flex items-center justify-center text-gray-500">
            <p>No cards on canvas. Add cards using the buttons above.</p>
          </div>
          
          <button 
            x-show="draggableCards.length > 0"
            type="button"
            class="absolute top-1 left-2 z-[9999] px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2"
            @click="clearCanvas()">
            Clear Canvas
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
