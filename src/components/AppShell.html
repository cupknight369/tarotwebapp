<!-- Root shell: auth gate - loading, login, or app -->
<div x-data="{}" class="min-h-screen bg-gray-800 text-white">
  <!-- Loading state -->
  <template x-if="$store.auth.loading">
    <div class="fixed inset-0 flex items-center justify-center bg-gray-800">
      <p class="text-gray-400">Loading...</p>
    </div>
  </template>

  <!-- Login page: only when not loading and not authenticated -->
  <template x-if="!$store.auth.loading && !$store.auth.user">
    <include src="./src/components/LoginPageComponent.html"></include>
  </template>

  <!-- App: only when authenticated - canvas is never mounted for unauthenticated users -->
  <template x-if="!$store.auth.loading && $store.auth.user">
    <div class="relative">
      <include src="./src/components/CanvasComponent.html"></include>
      <include src="./src/components/DialogComponent.html"></include>
      <include src="./src/components/SettingsComponent.html"></include>
      <include src="./src/components/AuthComponent.html"></include>
    </div>
  </template>
</div>
