<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tarot</title>
    <link href="./dist/output.css" rel="stylesheet" />
    <script defer type="text/javascript" src="./dist/index.js"></script>
    <script defer type="text/javascript" src="./dist/src/components/CanvasComponent.js"></script>
    <script defer type="text/javascript" src="alpine.min.js"></script>
  </head>

  <body class="bg-gray-800 text-white ">
    <!-- Draggable Zone -->
    <div 
      x-data="canvasComponent(Alpine)"
      id="draggable-container"
      class="relative w-screen h-screen bg-gray-900 border-2 border-gray-700 rounded-lg overflow-hidden">
      
      <div 
          x-ref="viewport"
          @mousedown="onMouseDown($event)"
          @mousemove="onMouseMove($event)"
          @mouseup="onMouseUp($event)"
          @mouseleave="onMouseUp($event)"
          @wheel.prevent="onWheel($event)"
          class="absolute inset-0 overflow-hidden cursor-grab">
        <div
          x-ref="content"
          class="relative w-[2000px] h-[2000px] bg-slate-800"
          :style="contentStyle">
          <template x-for="draggableCard in draggableCards" :key="draggableCard.id">
            <div 
              class="absolute cursor-grab select-none will-change-transform"
              :id="draggableCard.id"
              :style="`left: ${draggableCard.x}px; top: ${draggableCard.y}px; z-index: ${draggableCard.zIndex}; opacity: ${draggableCard.opacity}; cursor: ${draggableCard.cursor}; display: ${draggableCard.display};`">
              <img 
                :src="draggableCard.card.img" 
                :alt="draggableCard.card.title"
                class="w-[150px] h-auto pointer-events-none shadow-lg rounded block"
                style="max-width: 150px; width: 150px;"/>
            </div>
          </template>
          
          <div 
            x-show="draggableCards.length === 0"
            x-ref="emptyCanvasMessage"
            class="absolute inset-0 flex items-center justify-center text-gray-500">
            <p>No cards on canvas. Add cards using the buttons above.</p>
          </div>
        </div>
      </div>
      
      <div class="absolute top-1 right-2 z-[9999] flex items-center gap-1">
        <span 
          x-show="showShuffledConfirmation"
          x-transition
          class="ml-1 text-sm text-gray-300">Shuffled!</span>
        <button 
          type="button"
          class="w-8 h-8 rounded bg-gray-600/70 text-white text-lg leading-none hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer"
          aria-label="Single draw"
          @click="addCardToCanvas(Alpine.store('shuffledCards')[cryptoRandomInt(Alpine.store('shuffledCards').length)])">1</button>
        <button 
          type="button"
          class="w-8 h-8 rounded bg-gray-600/70 text-white text-lg leading-none hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer"
          aria-label="Multiple draw (1-10)"
          @click="(function(){ const n = parseInt(prompt('Number of cards (1-10)?', '1'), 10); if (n >= 1 && n <= 10) { const draws = drawMultipleCards(n); if (draws) { const s = Alpine.store('shuffledCards'); draws.forEach(i => addCardToCanvas(s[i])); } } })()">N</button>
        <button 
          type="button"
          class="w-8 h-8 rounded bg-gray-600/70 text-white text-lg leading-none hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer"
          aria-label="Draw at index (0-77)"
          @click="(function(){ const i = parseInt(prompt('Card index (0-77)?', '0'), 10); if (i >= 0 && i <= 77) { addCardToCanvas(Alpine.store('shuffledCards')[i]); } })()">#</button>
        <button 
          type="button"
          class="w-8 h-8 rounded bg-gray-600/70 text-white text-lg leading-none hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer"
          aria-label="Shuffle deck"
          @click="shuffleDeck()">⇅</button>
        <button 
          type="button"
          class="w-8 h-8 rounded bg-gray-600/70 text-white text-lg leading-none hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer"
          aria-label="Zoom in"
          @click="zoomIn()">+</button>
        <button 
          type="button"
          class="w-8 h-8 rounded bg-gray-600/70 text-white text-lg leading-none hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer"
          aria-label="Zoom out"
          @click="zoomOut()">−</button>
        <button 
          x-show="draggableCards.length > 0"
          type="button"
          class="w-8 h-8 rounded bg-gray-600/70 text-white text-lg leading-none hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 cursor-pointer"
          aria-label="Clear canvas"
          @click="showClearConfirm = true">🧹</button>
      </div>
      
      
      <!-- Clear canvas confirmation dialog -->
      <div 
        x-show="showClearConfirm"
        x-transition
        class="fixed inset-0 z-[10000] flex items-center justify-center bg-gray-900/80"
        role="dialog"
        aria-modal="true"
        aria-labelledby="clear-confirm-title">
        <div class="relative bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-xl max-w-md w-full mx-4">
          <button 
            type="button"
            class="cursor-pointer absolute top-2 right-2 rounded p-2 text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500"
            aria-label="Close"
            @click="showClearConfirm = false">
            <span class="text-xl leading-none">×</span>
          </button>
          <p id="clear-confirm-title" class="text-xl font-bold text-gray-200 pr-8 mb-6">Are you sure you want to clear the canvas?</p>
          <div class="flex gap-3 justify-end">
            <button 
              type="button"
              class="cursor-pointer px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
              @click="clearCanvas(); showClearConfirm = false">
              Yes
            </button>
            <button 
              type="button"
              class="cursor-pointer px-4 py-2 rounded-lg bg-gray-600 text-white hover:bg-gray-500 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
              @click="showClearConfirm = false">
              Cancel
            </button>
          </div>
        </div>
      </div>
    </div>

  </body>
</html>
