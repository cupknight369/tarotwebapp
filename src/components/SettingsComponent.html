<div
  x-cloak
  x-data="settingsComponent"
  x-show="$store.settings.open"
  x-transition
  class="fixed inset-0 z-[10000] flex items-center justify-center bg-gray-900/80"
  role="dialog"
  aria-modal="true"
  aria-labelledby="settings-title"
>
  <div
    class="relative bg-gray-800 border border-gray-700 rounded-lg p-6 shadow-xl max-w-md w-full mx-4 max-h-[90vh] overflow-y-auto"
  >
    <button
      type="button"
      class="cursor-pointer absolute top-2 right-2 rounded p-2 text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500"
      aria-label="Close"
      :disabled="isSettingsBusy()"
      :class="isSettingsBusy() ? 'opacity-40 cursor-not-allowed' : ''"
      @click="$store.settings.open = false"
    >
      <span class="text-xl leading-none">×</span>
    </button>

    <p id="settings-title" class="text-xl font-bold text-gray-200 pr-8 mb-6">App Settings</p>
    <label class="flex items-center gap-2 cursor-pointer">
      <input
        type="checkbox"
        x-model="$store.settings.censored"
        :disabled="isSettingsBusy()"
        class="rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer"
      />
      <span class="text-gray-200">Censored</span>
    </label>
    <label class="flex items-center gap-2 cursor-pointer mt-4">
      <input
        type="checkbox"
        x-model="$store.settings.showDeckTitleOnCanvas"
        :disabled="isSettingsBusy()"
        class="rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer"
      />
      <span class="text-gray-200">Show active deck on canvas</span>
    </label>
    <label class="flex items-center gap-2 cursor-pointer mt-4">
      <input
        type="checkbox"
        x-model="$store.settings.showCorrespondenceThumbnailsOnCanvas"
        :disabled="isSettingsBusy()"
        class="rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer"
      />
      <span class="text-gray-200">Show correspondence thumbnails</span>
    </label>
    <label class="flex items-center gap-2 cursor-pointer mt-4">
      <input
        type="checkbox"
        x-model="$store.settings.showCorrespondenceCountBarOnCanvas"
        :disabled="isSettingsBusy()"
        class="rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer"
      />
      <span class="text-gray-200">Show correspondence count on canvas</span>
    </label>
    <label class="flex items-center gap-2 cursor-pointer mt-4">
      <input
        type="checkbox"
        x-model="$store.settings.showCardCountBarOnCanvas"
        :disabled="isSettingsBusy()"
        class="rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer"
      />
      <span class="text-gray-200">Show card count on canvas</span>
    </label>

    <div class="mt-4">
      <button
        type="button"
        class="cursor-pointer w-full rounded-lg border border-gray-600 bg-gray-700 px-3 py-2 text-sm text-gray-200 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 disabled:opacity-50 disabled:cursor-not-allowed"
        :disabled="isSettingsBusy()"
        @click="$dispatch('open-correspondence-manager')"
      >
        Manage correspondences…
      </button>
    </div>

    <div class="border-t border-gray-700 mt-6 pt-6">
      <p class="text-sm font-medium text-gray-300 mb-1">Correspondence data</p>
      <p class="text-xs text-gray-500 mb-3">
        Export selected groups to a file, or import to add copies without replacing existing
        entries.
      </p>
      <p x-show="correspondenceGroupsPending" x-cloak class="text-xs text-gray-400 mb-2">
        Loading groups…
      </p>
      <p
        x-show="correspondenceGroupsLoadError"
        x-cloak
        class="text-xs text-red-400 mb-2"
        x-text="correspondenceGroupsLoadError"
      ></p>
      <div
        x-show="correspondenceGroups.length && !correspondenceGroupsPending"
        x-cloak
        class="mb-3"
      >
        <div class="flex items-center justify-between gap-2 mb-2">
          <span class="text-xs text-gray-400">Groups to export</span>
          <span class="text-xs shrink-0">
            <button
              type="button"
              class="cursor-pointer text-purple-400 hover:text-purple-300 disabled:opacity-50"
              :disabled="isSettingsBusy()"
              @click="selectAllCorrespondenceGroups()"
            >
              Select all
            </button>
            <span class="text-gray-600 mx-1">·</span>
            <button
              type="button"
              class="cursor-pointer text-purple-400 hover:text-purple-300 disabled:opacity-50"
              :disabled="isSettingsBusy()"
              @click="clearCorrespondenceGroupSelection()"
            >
              Clear all
            </button>
          </span>
        </div>
        <ul
          class="max-h-32 overflow-y-auto space-y-2 rounded border border-gray-700 bg-gray-900/50 p-2"
        >
          <template x-for="g in correspondenceGroups" :key="g.id">
            <li>
              <label class="flex items-center gap-2 cursor-pointer text-sm text-gray-200">
                <input
                  type="checkbox"
                  class="rounded bg-gray-700 border-gray-600 text-purple-600 focus:ring-purple-500 focus:ring-offset-0 cursor-pointer"
                  :checked="isCorrespondenceGroupSelected(g.id)"
                  :disabled="isSettingsBusy()"
                  @change="toggleCorrespondenceGroup(g.id)"
                />
                <span x-text="g.title"></span>
              </label>
            </li>
          </template>
        </ul>
      </div>
      <div class="flex flex-col gap-2">
        <button
          type="button"
          class="cursor-pointer px-3 py-2 rounded-lg bg-purple-600 text-white text-sm hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:opacity-50 disabled:cursor-not-allowed"
          :disabled="!canExportCorrespondences() || isSettingsBusy()"
          @click="openCorrespondenceExportConfirm()"
        >
          Export correspondences…
        </button>
        <button
          type="button"
          class="cursor-pointer px-3 py-2 rounded-lg bg-gray-700 text-gray-200 text-sm border border-gray-600 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 disabled:opacity-50 disabled:cursor-not-allowed"
          :disabled="isSettingsBusy()"
          @click="openCorrespondenceImportConfirm()"
        >
          Import correspondences…
        </button>
      </div>
      <input
        id="settings-correspondence-file-input"
        type="file"
        accept="application/octet-stream,.pb"
        class="sr-only"
        :disabled="isSettingsBusy()"
        @change="onCorrespondenceImportFileChange($event)"
      />

      <div x-show="correspondenceTransferBusy" x-cloak class="mt-4 space-y-2">
        <div class="h-2 bg-gray-700 rounded overflow-hidden">
          <div
            class="h-full bg-purple-600 transition-[width] duration-150"
            :style="`width: ${getCorrespondencePercent()}%`"
          ></div>
        </div>
        <p class="text-xs text-gray-400" x-text="correspondenceProgress.phase"></p>
        <p class="text-xs text-gray-500">
          <span x-text="getCorrespondenceElapsedLabel()"></span>
          <span
            x-show="getCorrespondenceEtaLabel()"
            x-text="' · ' + getCorrespondenceEtaLabel()"
          ></span>
        </p>
      </div>

      <div x-show="correspondenceResultSummary" x-cloak class="mt-4 space-y-2">
        <p class="text-sm text-gray-300" x-text="correspondenceResultSummary"></p>
        <ul
          x-show="correspondenceResultErrors.length"
          class="text-xs text-red-400 max-h-32 overflow-y-auto list-disc pl-4 space-y-1"
        >
          <template x-for="(err, idx) in correspondenceResultErrors" :key="idx">
            <li x-text="err"></li>
          </template>
        </ul>
      </div>
    </div>

    <div class="border-t border-gray-700 mt-6 pt-6">
      <p class="text-sm font-medium text-gray-300 mb-1">IndexedDB storage (estimate)</p>
      <p class="text-xs text-gray-400 mb-4" x-text="formatStorageLine()"></p>
      <p class="text-sm font-medium text-gray-300 mb-3">Local backup</p>
      <p class="text-xs text-gray-500 mb-3">Export or import a backup JSON file.</p>
      <div class="flex flex-col gap-2">
        <button
          type="button"
          class="cursor-pointer px-3 py-2 rounded-lg bg-purple-600 text-white text-sm hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:opacity-50 disabled:cursor-not-allowed"
          :disabled="isSettingsBusy()"
          @click="openExportConfirm()"
        >
          Export local data…
        </button>
        <button
          type="button"
          class="cursor-pointer px-3 py-2 rounded-lg bg-gray-700 text-gray-200 text-sm border border-gray-600 hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 disabled:opacity-50 disabled:cursor-not-allowed"
          :disabled="isSettingsBusy()"
          @click="openImportConfirm()"
        >
          Import from backup…
        </button>
      </div>
      <input
        id="settings-backup-file-input"
        type="file"
        accept="application/octet-stream,.pb"
        class="sr-only"
        :disabled="isSettingsBusy()"
        @change="onImportFileChange($event)"
      />

      <div x-show="backupBusy" x-cloak class="mt-4 space-y-2">
        <div class="h-2 bg-gray-700 rounded overflow-hidden">
          <div
            class="h-full bg-purple-600 transition-[width] duration-150"
            :style="`width: ${getBackupPercent()}%`"
          ></div>
        </div>
        <p class="text-xs text-gray-400" x-text="backupProgress.phase"></p>
        <p class="text-xs text-gray-500">
          <span x-text="getElapsedLabel()"></span>
          <span x-show="getEtaLabel()" x-text="' · ' + getEtaLabel()"></span>
        </p>
      </div>

      <div x-show="backupResultSummary" x-cloak class="mt-4 space-y-2">
        <p class="text-sm text-gray-300" x-text="backupResultSummary"></p>
        <ul
          x-show="backupResultErrors.length"
          class="text-xs text-red-400 max-h-32 overflow-y-auto list-disc pl-4 space-y-1"
        >
          <template x-for="(err, idx) in backupResultErrors" :key="idx">
            <li x-text="err"></li>
          </template>
        </ul>
      </div>
    </div>
  </div>
</div>
