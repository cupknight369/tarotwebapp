<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="theme-color" content="#101828" />
    <meta name="description" content="Customizeable Tarot Journal" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Tarot</title>
  </head>

  <body class="bg-gray-800 text-white">
    <include src="./src/components/CanvasComponent.html"></include>
    <include src="./src/components/WelcomeComponent.html"></include>
    <include src="./src/components/SettingsComponent.html"></include>
    <include src="./src/components/HelpComponent.html"></include>
    <include src="./src/components/AuthComponent.html"></include>
    <include src="./src/components/DeckEditComponent.html"></include>
    <include src="./src/components/CorrespondenceManagerComponent.html"></include>
    <include src="./src/components/DialogComponent.html"></include>

    <div
      id="loading-splash"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 20000;
        background-color: #101828;
      "
    ></div>

    <script type="module" src="./src/main.ts"></script>
    <script type="text/javascript">
      document.addEventListener('alpine:initialized', () => {
        document.getElementById('loading-splash').remove();
      });
    </script>
  </body>
