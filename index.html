<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tarot</title>
    <link href="./output.css" rel="stylesheet" />
    <script defer type="text/javascript" src="alpine.min.js"></script>
    <script defer type="text/javascript" src="./index.js"></script>
    <script type="text/javascript" src="http://livejs.com/live.js"></script>
  </head>

  <body class="bg-gray-800 p-6 text-white ">
    <main x-data="{
        num: 0,
        singleDrawNum: null,
        multiDrawNums: new Set([]),
      }">
      <h1 class="mt-5 text-xl font-medium tracking-tight">Hello Tarot!</h1>
      <hr class="py-3"/>

      <div>
        <button type="button" class="px-4 py-2 rounded-lg bg-purple-600 text-white hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2" @click="singleDrawNum = cryptoRandomInt($store.cards.length)">Single Draw</button>
        <p 
          x-text="singleDrawNum ? $store.shuffledCards[singleDrawNum]?.title : 'Nothing drawn yet...'"
          class="text-xl font-bold mt-3"></p>
      </div>
      
      <form class="flex flex-col mt-5" @submit.prevent="multiDrawNums = drawMultipleCards(this.multiDraw);">
        <label for="multiDraw" class="block text-xl font-bold text-gray-200 mb-1">Enter a number 1-10:</label>
        <input name="multiDraw" 
          class="w-full rounded-md border border-gray-600 bg-gray-900 text-gray-100
            placeholder-gray-500
            focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
            px-3 py-2 shadow-sm" 
          type="number" 
          min="1" 
          max="10" />
      </form>

      <ul>
        <template x-for="num in multiDrawNums">
          <li x-text="$store.shuffledCards[num]?.title"></li>
        </template>
      </ul>
    </main>
  </body>
</html>
